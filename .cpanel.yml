---
# Wdrożenie przez cPanel -> Git Version Control -> "Deploy HEAD Commit".
# Cała logika jest w deploy/deploy.sh (sam znajduje PHP i Composera).
# Log: /home/iascomm/Energieableseportal/storage/logs/deploy.log
deployment:
  tasks:
    - export APP=/home/iascomm/Energieableseportal
    - export WEB=/home/iascomm/public_html/em
    - /bin/bash $APP/deploy/deploy.sh > $APP/storage/logs/deploy.log 2>&1
